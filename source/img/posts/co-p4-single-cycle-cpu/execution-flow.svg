<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720"><rect width="100%" height="100%" fill="#f8fafc"/><text x="750.0" y="44" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#0f172a">每条指令的统一处理流程</text><text x="750.0" y="85" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#64748b">“默认赋值 → 指令动作”是组合逻辑，不额外占用一个时钟周期</text><rect x="45" y="155" width="320" height="115" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="205.0" y="197.5" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#0f172a">IFU 取指</text><text x="205.0" y="227.5" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#0f172a">提供 instr 和当前 PC</text><rect x="405" y="155" width="320" height="115" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="565.0" y="197.5" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#0f172a">Execute 拆分字段</text><text x="565.0" y="227.5" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#0f172a">GRF 同时读取三路旧值</text><rect x="765" y="155" width="320" height="115" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="925.0" y="197.5" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#0f172a">统一设置默认值</text><text x="925.0" y="227.5" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#0f172a">关闭写入和转移</text><rect x="1125" y="155" width="320" height="115" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="1285.0" y="197.5" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#0f172a">匹配指令分支</text><text x="1285.0" y="227.5" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#0f172a">覆盖本指令所需输出</text><polyline points="365,212 405,212" fill="none" stroke="#475569" stroke-width="3"/><polygon points="405,212 394.1946347717679,217.21958640933477 394.1946347717679,206.78041359066523" fill="#475569"/><polyline points="725,212 765,212" fill="none" stroke="#475569" stroke-width="3"/><polygon points="765,212 754.1946347717678,217.21958640933477 754.1946347717678,206.78041359066523" fill="#475569"/><polyline points="1085,212 1125,212" fill="none" stroke="#475569" stroke-width="3"/><polygon points="1125,212 1114.1946347717678,217.21958640933477 1114.1946347717678,206.78041359066523" fill="#475569"/><rect x="920" y="395" width="485" height="120" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1162.5" y="440.0" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#0f172a">组合结果稳定</text><text x="1162.5" y="470.0" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#0f172a">加载数据返回；确定写回与下一地址</text><polyline points="1280,270 1280,395" fill="none" stroke="#475569" stroke-width="3"/><polygon points="1280,395 1274.7804135906651,384.1946347717679 1285.2195864093349,384.1946347717679" fill="#475569"/><rect x="350" y="395" width="425" height="120" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="562.5" y="426.0" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#0f172a">下一个时钟上升沿</text><text x="562.5" y="455.0" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#0f172a">reset=1：复位优先</text><text x="562.5" y="484.0" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#0f172a">否则：更新 PC / GRF / DM</text><polyline points="920,455 775,455" fill="none" stroke="#475569" stroke-width="3"/><polygon points="775,455 785.8053652282322,449.78041359066526 785.8053652282322,460.21958640933474" fill="#475569"/><polyline points="350,455 200,455 200,270" fill="none" stroke="#475569" stroke-width="3"/><polygon points="200,270 205.21958640933477,280.8053652282321 194.78041359066523,280.8053652282321" fill="#475569"/><text x="750" y="610" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="700" fill="#0f172a">默认下一地址为 PC+4；pcRedirect=1 时，下一地址改用 pcTarget。</text></svg>