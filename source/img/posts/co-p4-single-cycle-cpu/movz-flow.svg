<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="100%" height="100%" fill="#f8fafc"/><text x="700.0" y="44" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#0f172a">movz：条件传送的执行流程</text><text x="700.0" y="85" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#64748b">movz rd, rs, rt  →  当 GPR[rt]=0 时，GPR[rd]←GPR[rs]</text><rect x="470" y="140" width="460" height="95" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="700.0" y="187.5" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#0f172a">译码：opcode=00，funct=0a</text><rect x="470" y="300" width="460" height="95" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="700.0" y="347.5" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#0f172a">读取 rsData、rtData 的旧值</text><polyline points="700,235 700,300" fill="none" stroke="#475569" stroke-width="3"/><polygon points="700,300 694.7804135906653,289.1946347717679 705.2195864093347,289.1946347717679" fill="#475569"/><rect x="510" y="455" width="380" height="80" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="700.0" y="495.0" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#0f172a">rtData == 0 ?</text><polyline points="700,395 700,455" fill="none" stroke="#475569" stroke-width="3"/><polygon points="700,455 694.7804135906653,444.1946347717679 705.2195864093347,444.1946347717679" fill="#475569"/><rect x="55" y="605" width="550" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="330.0" y="641.0" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#0f172a">是：regWriteEnable=1</text><text x="330.0" y="669.0" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#0f172a">regWriteAddr=rdAddr；regWriteData=rsData</text><rect x="820" y="605" width="510" height="100" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="1075.0" y="641.0" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#0f172a">否：regWriteEnable 保持 0</text><text x="1075.0" y="669.0" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#0f172a">目标寄存器保持原值</text><polyline points="510,495 330,495 330,605" fill="none" stroke="#475569" stroke-width="3"/><polygon points="330,605 324.78041359066526,594.1946347717678 335.21958640933474,594.1946347717678" fill="#475569"/><text x="420" y="470" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#475569">是</text><polyline points="890,495 1075,495 1075,605" fill="none" stroke="#475569" stroke-width="3"/><polygon points="1075,605 1069.7804135906651,594.1946347717678 1080.2195864093349,594.1946347717678" fill="#475569"/><text x="980" y="470" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#475569">否</text><text x="700" y="770" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="700" fill="#0f172a">两条路径均不访问内存、不请求跳转；下一 PC 均为 PC+4。</text></svg>